<div class="address-region-toggle" role="radiogroup" aria-label="{{ _('Страна проживания для подсказки адреса') }}">
    <label class="address-region-toggle__option">
        <input
            type="radio"
            name="{{ toggle_name }}"
            value="ru"
            {% if initial_ru %}checked{% endif %}
        >
        <span class="address-region-toggle__text">{{ _('Я из России') }}</span>
    </label>
    <label class="address-region-toggle__option">
        <input
            type="radio"
            name="{{ toggle_name }}"
            value="other"
            {% if not initial_ru %}checked{% endif %}
        >
        <span class="address-region-toggle__text">{{ _('Я не из России') }}</span>
    </label>
</div>
