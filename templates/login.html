{% extends "base.html" %}

{% block title %}Вход через GWars - {{ project_name }}{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="admin-container">
        <div class="layout-inner empty-state">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">🎅</div>
            <h1 style="margin-bottom: 1rem; color: var(--text-primary);">{{ _('Вход через GWars') }}</h1>
            <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
                {{ _('Для участия в мероприятиях необходимо войти через игровой аккаунт GWars.') }}
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('auth.login_go', next=return_url) if return_url else url_for('auth.login_go') }}" class="btn btn-primary btn-large">
                    {{ _('Войти через GWars') }}
                </a>
                <a href="{{ url_for('public.index') }}" class="btn btn-secondary btn-large">
                    {{ _('На главную') }}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
