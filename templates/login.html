{% extends "base.html" %}

{% block title %}Вход через GWars - {{ project_name }}{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="admin-container">
        <div class="empty-state" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem;">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">🎅</div>
            <h1 style="margin-bottom: 1rem; color: var(--text-primary);">Вход через GWars</h1>
            <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
                Для участия в мероприятиях необходимо войти через игровой аккаунт GWars.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('auth.login_go', next=return_url) if return_url else url_for('auth.login_go') }}" class="btn btn-primary btn-large">
                    Войти через GWars
                </a>
                <a href="{{ url_for('public.index') }}" class="btn btn-secondary btn-large">
                    На главную
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
